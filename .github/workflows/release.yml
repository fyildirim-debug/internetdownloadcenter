name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux paketleri
    runs-on: ubuntu-22.04
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm file
      - run: npm ci
        working-directory: ui
      - name: Köprü (sidecar)
        run: scripts/sidecar.sh release
      - name: yt-dlp'yi pakete göm
        run: scripts/fetch-tools.sh linux
      - name: Derle (deb, rpm, AppImage)
        run: npx -y @tauri-apps/cli@2 build --bundles deb,rpm,appimage
      - name: Firefox eklentisini imzala (isteğe bağlı)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          npx -y web-ext@8 sign --channel unlisted --source-dir extension/build/firefox \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir extension/build/signed || true
          if ls extension/build/signed/*.xpi >/dev/null 2>&1; then cp extension/build/signed/*.xpi extension/build/idc-firefox-signed.xpi; fi
      - name: Dosyaları topla
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/InternetDownloadCenter_${GITHUB_REF_NAME#v}_amd64.deb || true
          cp target/release/bundle/rpm/*.rpm out/InternetDownloadCenter-${GITHUB_REF_NAME#v}.x86_64.rpm || true
          cp target/release/bundle/appimage/*.AppImage out/InternetDownloadCenter_${GITHUB_REF_NAME#v}_x86_64.AppImage || true
          cp extension/build/idc-chromium.zip out/
          cp extension/build/idc-firefox.xpi out/
          cp extension/build/idc-firefox-signed.xpi out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    name: Windows kurulumu ve taşınabilir sürüm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - name: Köprü (sidecar)
        shell: bash
        run: scripts/sidecar.sh release
      - name: yt-dlp'yi pakete göm
        shell: bash
        run: scripts/fetch-tools.sh windows
      - name: Derle (NSIS)
        run: npx -y @tauri-apps/cli@2 build --bundles nsis
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "portable/InternetDownloadCenter"
          New-Item -ItemType Directory -Force -Path "$dir/extension" | Out-Null
          Copy-Item target/release/internet-download-center.exe $dir/
          Copy-Item target/release/idc-host.exe $dir/
          Copy-Item -Recurse extension/build/chromium "$dir/extension/chromium"
          Copy-Item extension/build/idc-firefox.xpi "$dir/extension/"
          Copy-Item extension/build/idc-chromium.zip "$dir/extension/"
          New-Item -ItemType Directory -Force -Path "$dir/tools" | Out-Null
          Copy-Item src-tauri/tools/yt-dlp.exe "$dir/tools/"
          Set-Content -Path "$dir/portable.txt" -Value "Bu dosya varken ayarlar ve liste 'data' klasorunde tutulur."
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "portable/*" -DestinationPath "out/InternetDownloadCenter_${ver}_x64_portable.zip"
          Copy-Item target/release/bundle/nsis/*.exe "out/InternetDownloadCenter_${ver}_x64_setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    name: GitHub sürümü
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
