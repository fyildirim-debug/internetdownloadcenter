name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Arayüz
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm run build
      - name: Eklenti
        run: node extension/build.mjs
      - name: Köprü (sidecar)
        shell: bash
        run: scripts/sidecar.sh debug
      - name: Rust testleri
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness
