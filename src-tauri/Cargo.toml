[package]
name = "internet-download-center"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Internet Download Center - indirme yöneticisi"
default-run = "internet-download-center"

[lib]
name = "idc_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idc-core = { path = "../crates/idc-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"
url = "2"
dirs = "6"
regex = "1"
scraper = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
