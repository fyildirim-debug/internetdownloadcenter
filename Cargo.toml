[workspace]
resolver = "2"
members = ["crates/idc-core", "crates/idc-host"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Furkan YILDIRIM <posta@furkanyildirim.com>"]
repository = "https://github.com/fyildirim-debug/internetdownloadcenter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
